# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name : Fournir access au runner
        run: chmod +x mvnw

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-reports
          path: TP3_TaAnhQuoc/target/site/jacoco

      - name: Build and run tests
        run: ./mvnw -B clean package -DskipTests   # produit le .jar dans target/

      - name: Publier le .jar en artefact
        if: matrix.java == '21'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar   
  build-and-push-image:
    needs: build-and-test
    if: always() && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - name: Récupérer le .jar déjà construit
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convertir le nom du compte/organisation en minuscules
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tp_biblio:latest
            ghcr.io/${{ env.OWNER_LC }}/tp_biblio:${{ github.sha }}     